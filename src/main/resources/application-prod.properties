# ---- DATABASE (SQLite) ----
spring.datasource.url=jdbc:sqlite:${DB_PATH}
spring.datasource.driver-class-name=org.sqlite.JDBC

# ---- JPA / HIBERNATE ----
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Traffic events are logged at INFO. Set this category to DEBUG when full request/response
# formatting (headers and bodies) is needed for troubleshooting.
logging.level.hu.budgetflix.api.traffic=DEBUG

# ---- SERVER ----
server.port=8080